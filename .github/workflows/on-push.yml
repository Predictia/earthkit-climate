name: on-push

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -l {0}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: 3.x
      - uses: pre-commit/action@v3.0.0

  combine-environments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install conda-merge
        run: |
          pip install conda-merge

      - name: Combine environments
        run: |
          for SUFFIX in ci integration; do
            conda-merge ci/environment-${SUFFIX}.yml environment.yml > ci/combined-environment-${SUFFIX}.yml
          done

      - name: Archive combined environments
        uses: actions/upload-artifact@v4
        with:
          name: combined-environments
          path: ci/combined-environment-*.yml

  unit-tests:
    name: unit-tests (3.10)
    needs: combine-environments
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download combined environments
        uses: actions/download-artifact@v4
        with:
          name: combined-environments
          path: ci

      - name: Install Conda environment with Micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: ci/combined-environment-ci.yml
          environment-name: DEVELOP
          micromamba-version: "latest"
          cache-environment: true
          create-args: >-
            python=3.10

      - name: Install package
        run: |
          python -m pip install --no-deps -e .

      - name: Run tests
        run: |
          make unit-tests COV_REPORT=xml

  docs-build:
    needs: [combine-environments, unit-tests]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download combined environments
        uses: actions/download-artifact@v4
        with:
          name: combined-environments
          path: ci

      - name: Install Conda environment with Micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: ci/combined-environment-ci.yml
          environment-name: DEVELOP
          micromamba-version: "1.5.8"
          cache-environment: true
          create-args: >-
            python=3.10

      - name: Install package
        run: |
          python -m pip install --no-deps -e .

      - name: Build documentation
        run: |
          make docs-build

  integration-tests:
    needs: [combine-environments, unit-tests]
    if: |
      success() && false
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - python-version: "3.10"
            extra: "-integration"

    steps:
      - uses: actions/checkout@v4

      - name: Download combined environments
        uses: actions/download-artifact@v4
        with:
          name: combined-environments
          path: ci

      - name: Install Conda environment with Micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: ci/combined-environment${{ matrix.extra }}.yml
          environment-name: DEVELOP${{ matrix.extra }}
          micromamba-version: "1.5.8"
          cache-environment: true
          create-args: >-
            python=${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --no-deps -e .

      - name: Run tests
        run: |
          make unit-tests COV_REPORT=xml
